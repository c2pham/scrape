<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MLS & Realtor.com Scraper</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>MLS & Realtor Scraper</h1>
      <p class="subtitle">Homes built in 2025 & Closed land lots</p>
    </header>

    <div class="stats">
      <div class="stat-item">
        <span class="stat-label">Total Listings:</span>
        <span class="stat-value" id="totalCount">0</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">Total Realtors:</span>
        <span class="stat-value" id="realtorCount">0</span>
      </div>
    </div>

    <div class="filters">
      <label>
        <span>Filter by source:</span>
        <select id="sourceFilter">
          <option value="">All Sources</option>
          <option value="realtor.com">Realtor.com</option>
          <option value="loopnet">LoopNet</option>
          <option value="mls">MLS</option>
        </select>
      </label>

      <label>
        <span>Filter by type:</span>
        <select id="typeFilter">
          <option value="">All Types</option>
          <option value="new_home">New Homes (2025)</option>
          <option value="closed_land_lot">Closed Land Lots</option>
        </select>
      </label>
    </div>

    <div class="bulk-search">
      <button id="toggleBulkSearch" class="btn btn-toggle">Bulk Search</button>
      <div id="bulkSearchPanel" class="bulk-search-panel" style="display: none;">
        <label>
          <span>Search queries (one per line):</span>
          <textarea id="bulkSearchQueries" placeholder="Example:&#10;Los Angeles CA land for sale&#10;San Francisco CA new homes&#10;Seattle WA commercial property" rows="5"></textarea>
        </label>
        <label>
          <span>Target websites:</span>
          <div class="checkbox-group">
            <label class="checkbox-label">
              <input type="checkbox" id="searchRealtor" checked>
              <span>Realtor.com</span>
            </label>
            <label class="checkbox-label">
              <input type="checkbox" id="searchLoopNet" checked>
              <span>LoopNet</span>
            </label>
          </div>
        </label>
        <label>
          <span>Delay between searches (seconds):</span>
          <input type="number" id="searchDelay" min="3" max="30" value="5">
        </label>
        <button id="startBulkSearch" class="btn btn-primary">Start Bulk Search</button>
        <div id="bulkSearchStatus" class="bulk-search-status"></div>
      </div>
    </div>

    <div class="actions">
      <button id="refreshBtn" class="btn btn-primary">Refresh</button>
      <button id="exportJsonBtn" class="btn btn-secondary">Export JSON</button>
      <button id="exportCsvBtn" class="btn btn-secondary">Export CSV</button>
      <button id="clearBtn" class="btn btn-danger">Clear All</button>
    </div>

    <div class="content">
      <div id="loading" class="loading" style="display: none;">
        <div class="spinner"></div>
        <p>Loading data...</p>
      </div>

      <div id="emptyState" class="empty-state" style="display: none;">
        <p>No data scraped yet.</p>
        <p class="hint">Visit Realtor.com or MLS listing pages to start scraping!</p>
      </div>

      <div id="dataList" class="data-list"></div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
